# Sector definition — Quantum computing
#
# Every parameter that defines the dataset lives here, so that the analysis code
# contains no hard-coded codes, keywords or years. Changing the sector boundary
# is a change to this file, not to the pipeline.
#
# Team 30 · Innovation Management · A.Y. 2026/27 · Politecnico di Torino

sector:
  name: "Quantum computing"
  client: "Dell"
  team: 30

# ---------------------------------------------------------------- CPC codes
#
# Matching is by prefix on the blank-stripped symbol, so "G06N10/00" selects
# G06N10/00 and anything whose symbol string begins with it. Note that this is
# a string prefix and not a hierarchy walk: "G06N10/00" does NOT select
# G06N10/20, which is why every subgroup is listed explicitly below.
#
# Codes were selected by reading the official CPC scheme definitions at
# https://www.cooperativepatentclassification.org, not the class titles alone.

cpc:
  # Core: quantum computing proper. G06N10/00 is titled
  # "Quantum computing, i.e. information processing based on quantum-mechanical
  # phenomena"; the five subgroups partition it.
  core:
    - "G06N10/00"   # Quantum computing (parent)
    - "G06N10/20"   # Models of quantum computing, e.g. quantum circuits
    - "G06N10/40"   # Physical realisations / architectures of quantum processors
    - "G06N10/60"   # Quantum algorithms
    - "G06N10/70"   # Quantum error correction, detection or prevention
    - "G06N10/80"   # Quantum programming, SDKs, cloud access platforms

  # Enabling hardware. Lower precision than the core: these classes also cover
  # subject matter outside quantum computing, so families entering only through
  # them are the ones most in need of validation. Empty since 23 October: the
  # validation showed H10N60/12 does not identify quantum computing on its own
  # (see `excluded` below).
  hardware: []

  # Deliberately excluded, with the evidence. These codes were in the definition
  # until 17 October and were removed after the block decomposition
  # (docs/methodology.md §8, outputs/tables/tab_blocks.csv) showed what they were
  # actually measuring. Recorded rather than deleted so the choice stays visible.
  excluded:
    # B82Y10/00 — Nanotechnology for information processing, storage or
    # transmission, "e.g. quantum computing". The title invites inclusion; the
    # data does not support it. Counted on its own the code holds 96% of our
    # year-2000 families, falls 89% from its 2004 peak to its 2014 trough, and
    # compounds at zero across the whole window: 1,039 families in 2000 and
    # 1,034 in 2022. It contributed the entire decline-and-recovery shape of the
    # volume curve and none of the trend, and at 21,975 families it was 44% of
    # the sector. Genuine quantum-nanotechnology families still enter through
    # the keyword branch, which is why removing it costs coverage but not signal.
    - "B82Y10/00"

    # H10N60/12 — Josephson-effect devices. Removed on 23 October after the
    # hand-labelled validation (docs/validation.md): of 20 families entering
    # only through this code, 1 was quantum computing. The class covers
    # Josephson junctions in general — superconducting electronics, memories,
    # junction fabrication. Superconducting-qubit families carry a G06N10 code
    # or a qubit keyword and still enter through those; the cost is at most 563
    # families, 4.2% of the 2000-2022 sector.
    - "H10N60/12"

  # Quantum communication. Included in the current dataset; this is a scope
  # decision, not a precision question — these families are correctly classified,
  # the question is whether they belong to *this* sector. See docs/methodology.md.
  #
  # Now measured: 894 families with a 2022 priority year against 1,915 for
  # G06N10, growing at 20.8% a year. Roughly a third of recent activity, which
  # is too large to merge silently into a headline figure — whichever way the
  # boundary is drawn, this block has to be named and reported.
  communication:
    - "H04B10/70"   # Photonic quantum communication
    - "H04L9/0852"  # Quantum key distribution

  # Pre-2019 scheme. Quantum computing sat under G06N99/002 before G06N10 was
  # created. Not currently used: include it only if the backfile turns out to be
  # incompletely reclassified. Diagnostic not yet run.
  legacy:
    - "G06N99/002"

# ---------------------------------------------------------------- keywords
#
# Searched case-insensitively in titles (tls202) and abstracts (tls203), OR-ed
# with the CPC codes. Terms are deliberately multi-word or technically specific:
# the bare word "quantum" is unusable here, since quantum dot, quantum well and
# quantum efficiency are optoelectronics vocabulary with no relation to computing.
#
# "quantum comput" was removed on 23 October after the validation
# (docs/validation.md). It matched 27 of the 39 keyword-only false positives:
# patents that name quantum computing only as a possible use ("...using quantum
# computing") or that defend against it (post-quantum cryptography). A family
# that is really about quantum computing almost always also names one of the
# specific terms below, so it still enters; in the validation sample 16 of the
# 21 genuine keyword-only families did.

keywords:
  - "qubit"
  - "qbit"
  - "quantum bit"
  - "quantum gate"
  - "quantum logic gate"
  - "quantum circuit"
  - "quantum register"
  - "quantum algorithm"
  - "quantum annealing"
  - "quantum annealer"
  - "quantum error correction"
  - "quantum supremacy"
  - "quantum advantage"
  - "quantum processor"
  - "quantum processing unit"
  - "transmon"
  - "superconducting qubit"
  - "trapped ion qubit"
  - "topological qubit"
  - "spin qubit"
  - "photonic qubit"

# An application matching a keyword is still left out of the keyword branch when
# its title or abstract contains one of these phrases. They mark post-quantum
# cryptography: classical encryption built to resist future quantum computers,
# which mentions quantum computing without being about it. In the validation
# sample none of the keyword-only families carrying such a phrase was quantum
# computing. Applied to the keyword branch only: a family with a G06N10 code is
# kept whatever its text says.

keyword_exclusions:
  - "anti-quantum"
  - "post-quantum"
  - "quantum-resistant"
  - "quantum resistant"
  - "quantum-safe"
  - "quantum safe"
  - "resist quantum"
  - "resisting quantum"
  - "resistant to quantum"
  - "quantum attack"
  - "quantum computer attack"
  - "quantum computing attack"
  - "secure from quantum"

# ---------------------------------------------------------------- time window
#
# The window closes at 2022, as set by the course. Applications publish some
# 18 months after the priority date and reach PATSTAT later still, so recent
# priority years are structurally incomplete; ending the window at the last year
# treated as complete means no incomplete year is ever plotted.

time:
  year_min: 2000
  year_max: 2022
  last_complete_year: 2022
  family_time_column: "earliest_filing_year"   # family: earliest priority year
  appln_time_column: "appln_filing_year"       # application: its own filing year

# ---------------------------------------------------------------- counting rules

counting:
  ipr_type: "PI"                               # patents of invention; excludes utility models
  ip5_offices: ["EP", "US", "CN", "JP", "KR"]
  top_n: 8                                     # categories shown before pooling into "Other"

# ---------------------------------------------------------------- environment

patstat:
  env: "PROD"                                  # TEST for development, PROD for reported numbers

# ---------------------------------------------------------------- output paths

output:
  directory: "outputs"
